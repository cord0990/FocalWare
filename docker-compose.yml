services:
  db:
    image: postgres:16-alpine
    container_name: focalware-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: focalware
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/focalware.sql:/docker-entrypoint-initdb.d/01-focalware.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focalware"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
