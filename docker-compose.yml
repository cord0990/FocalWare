services:
  db:
    image: postgres:16-alpine
    container_name: focalware-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: focalware
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Se usa 5434 en el computador para no chocar con un PostgreSQL instalado en Windows
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No se monta focalware.sql: el esquema lo crea Prisma con las
      # migraciones de backend/prisma/migrations (npm run db:migrate).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focalware"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: focalware-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Debe coincidir con el puerto del mapeo de ports (3000) y con el
      # EXPOSE del Dockerfile. Con 3001 la API escuchaba en un puerto que
      # Docker no publica y el frontend se quedaba sin conexión.
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: focalware
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/focalware
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRETO: ${JWT_SECRETO:-cambia_esta_clave}
      JWT_EXPIRACION: ${JWT_EXPIRACION:-15m}
    ports:
      - "3000:3000"
    volumes:
      # Para que las fotos subidas en desarrollo no se pierdan al recrear.
      - ./backend/uploads:/app/uploads

volumes:
  pgdata: