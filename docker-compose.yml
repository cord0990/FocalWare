services:
  db:
    image: postgres:16-alpine
    container_name: focalware-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: focalware
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Se usa 5434 en el computador para no chocar con un PostgreSQL instalado en Windows
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No se monta focalware.sql: el esquema lo crea Prisma con las
      # migraciones de backend/prisma/migrations (npm run db:migrate).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focalware"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    image: focalware-api:latest
    container_name: focalware-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Debe coincidir con el puerto del mapeo de ports (3000) y con el
      # EXPOSE del Dockerfile. Con 3001 la API escuchaba en un puerto que
      # Docker no publica y el frontend se quedaba sin conexión.
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: focalware
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/focalware
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Si queda vacío, el entrypoint genera una clave aleatoria y la guarda
      # en el volumen appdata. Definir JWT_SECRETO para fijarla manualmente.
      JWT_SECRETO: ${JWT_SECRETO:-}
      JWT_EXPIRACION: ${JWT_EXPIRACION:-15m}
      # El frontend llega a través de nginx, que pone la IP real del cliente en X-Forwarded-For.
      # Sin esto, todos los usuarios compartirían el límite de intentos de la IP del proxy.
      TRUST_PROXY: "1"
    ports:
      # Solo el computador local puede llamar a la API directamente (Postman).
      # El navegador entra por el frontend (5173) y nginx reenvía /api.
      - "127.0.0.1:3000:3000"
    volumes:
      # Para que las fotos subidas en desarrollo no se pierdan al recrear.
      - ./backend/uploads:/app/uploads
      # Guarda el JWT_SECRETO generado para reutilizarlo en cada arranque.
      - appdata:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: focalware-frontend:latest
    container_name: focalware-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
  appdata:
