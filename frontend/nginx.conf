server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La app sube hasta 5 fotos de 5 MB cada una.
    client_max_body_size 30m;

    # Optimización: comprime el texto (JS, CSS, JSON, SVG) antes de enviarlo.
    # Los archivos de la app bajan a cerca de un tercio de su tamaño.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Resuelve "api" en cada petición, no solo al arrancar. Así, si se recrea
    # el contenedor del backend, nginx toma su IP nueva sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe a propósito: el backend confía en esta cabecera
        # (TRUST_PROXY=1) y nadie debe poder falsificarla desde el navegador.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /uploads/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Optimización: los archivos de /assets llevan un código en el nombre que
    # cambia en cada build, así que el navegador los guarda por un año sin
    # volver a pedirlos. index.html no se guarda, para que siempre tome la
    # versión nueva de la app.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La app usa React Router: cualquier ruta interna tiene que devolver
    # index.html para que el navegador la resuelva del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
