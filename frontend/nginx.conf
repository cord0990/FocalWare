server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La app sube hasta 5 fotos de 5 MB cada una.
    client_max_body_size 30m;

    # Resuelve "api" en cada petición, no solo al arrancar. Así, si se recrea
    # el contenedor del backend, nginx toma su IP nueva sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe a propósito: el backend confía en esta cabecera
        # (TRUST_PROXY=1) y nadie debe poder falsificarla desde el navegador.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /uploads/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # La app usa React Router: cualquier ruta interna tiene que devolver
    # index.html para que el navegador la resuelva del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
